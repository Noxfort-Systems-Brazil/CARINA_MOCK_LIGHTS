      - Master MOC: en/carina_moc.md
      - System Architecture: en/architecture.md
      - API & Protocol Reference: en/api_reference.md
      - Hardware Simulation: en/hardware_simulation.md
      - Fault Injection Engine: en/fault_injection_engine.md
      - SUMO Integration: en/sumo_integration.md
